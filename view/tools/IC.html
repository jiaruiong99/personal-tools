<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia IC PDF Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
      body{
          font-family:Arial, sans-serif;
          padding:20px;
          background:#f5f5f5;
      }

      .card{
          background:white;
          border:1px solid #ddd;
          padding:15px;
          max-width:600px;
          margin-bottom:20px;
          border-radius:10px;
      }

      h2{
          max-width:600px;
      }

      button, input, select{
          width:100%;
          padding:10px;
          margin-top:8px;
          box-sizing:border-box;
      }

      button{
          background:#0066ff;
          color:white;
          border:none;
          border-radius:8px;
          font-size:16px;
      }


      canvas{
          width:100%;
          margin-top:10px;
          border:1px solid #ccc;
          touch-action:none;
      }

      .camera-box{
          position:relative;
          width:100%;
          max-width:600px;
      }


      video{
          width:100%;
          border-radius:10px;
      }


      .ic-frame{
          position:absolute;
          width:70%;
          aspect-ratio:1.585;
          border:3px solid white;
          left:15%;
          top:30%;
          box-sizing:border-box;
          pointer-events:none;
      }


      .hidden{
          display:none;
      }
    </style>
  </head>

  <body>
    <h2>Malaysia IC PDF Generator </h2>
    <div class="card">
      <h3> Front IC </h3>
      <div class="camera-box hidden" id="frontCameraBox">
        <video id="frontVideo" autoplay playsinline></video>
        <div class="ic-frame"></div>
      </div>
      <button onclick="startCamera('front')"> Take Front IC Photo </button>
      <input type="file" accept="image/*" id="frontUpload">
      <canvas id="frontCanvas"></canvas>
    </div>
    <div class="card">
      <h3> Back IC </h3>
      <div class="camera-box hidden" id="backCameraBox">
        <video id="backVideo" autoplay playsinline></video>
        <div class="ic-frame"></div>
      </div>
      <button onclick="startCamera('back')"> Take Back IC Photo </button>
      <input type="file" accept="image/*" id="backUpload">
      <canvas id="backCanvas"></canvas>
    </div>
    <div class="card">
      <h3> Watermark Settings </h3>
      <label> Mode </label>
      <select id="mode">
        <option value="color"> Color </option>
        <option value="bw"> Black & White </option>
      </select>
      <label> Text </label>
      <input id="wmText" value="VERIFICATION ONLY">
      <label> Color </label>
      <input type="color" id="wmColor" value="#808080">
      <label> Opacity </label>
      <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.3">
      <p> 👆 Drag watermark = Move <br> 🤏 Pinch = Resize <br> 🔄 Two fingers = Rotate </p>
    </div>
    <button onclick="generatePDF()"> Generate PDF </button>
  </body>

    <script>
        let frontImg = null;
        let backImg = null;
        let currentCamera = null;
        let currentSide = null;

        let frontCanvas = document.getElementById("frontCanvas");
        let backCanvas = document.getElementById("backCanvas");
        let frontCtx = frontCanvas.getContext("2d");
        let backCtx = backCanvas.getContext("2d");

        let watermark = {
            x: 250,
            y: 160,
            size: 40,
            rotation: -30,
        };

        document.getElementById("frontUpload").onchange = function (e) {
            loadImage(e.target.files[0], (img) => {
                frontImg = img;
                draw(frontImg, frontCanvas);
            });
        };

        document.getElementById("backUpload").onchange = function (e) {
            loadImage(e.target.files[0], (img) => {
                backImg = img;
                draw(backImg, backCanvas);
            });
        };

        function loadImage(file, callback) {
            let reader = new FileReader();

            reader.onload = function (e) {
                let img = new Image();
                img.onload = function () { callback(img); };
                img.src = e.target.result;
            };

            reader.readAsDataURL(file);
        }

        async function startCamera(side) {
            currentSide = side;

            let video = document.getElementById(side + "Video");
            let box = document.getElementById(side + "CameraBox");
            box.classList.remove("hidden");

            currentCamera = await navigator.mediaDevices.getUserMedia({
                video: {
                facingMode: "environment",
                },
            });

            video.srcObject = currentCamera;
        }

        // ==============================
        // CAMERA CAPTURE
        // ==============================

        function capturePhoto() {
            if (!currentSide || !currentCamera) return;
            let video = document.getElementById(currentSide + "Video");
            let temp = document.createElement("canvas");
            temp.width = video.videoWidth;
            temp.height = video.videoHeight;

            let ctx = temp.getContext("2d");
            ctx.drawImage(video, 0, 0, temp.width, temp.height);
            cropIC(temp, currentSide);

            currentCamera.getTracks().forEach((track) => {
                track.stop();
            });
        }

        function cropIC(source, side) {
            let ratio = 85.6 / 54;
            let width = source.width;
            let height = width / ratio;

            if (height > source.height) {
                height = source.height;
                width = height * ratio;
            }

            let x = (source.width - width) / 2;
            let y = (source.height - height) / 2;
            let crop = document.createElement("canvas");
            crop.width = width;
            crop.height = height;

            let ctx = crop.getContext("2d");

            ctx.drawImage( source, x, y, width, height, 0, 0, width, height);

            let img = new Image();
            img.onload = function () {
                if (side == "front") {
                    frontImg = img;
                    draw(frontImg, frontCanvas);
                } else {
                    backImg = img;
                    draw(backImg, backCanvas);
                }
            };

            img.src = crop.toDataURL("image/jpeg");
        }

        // ==============================
        // DRAW IC
        // ==============================

        function draw(img, canvas) {
            let ctx = canvas.getContext("2d");
            canvas.width = 500;
            canvas.height = 315;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            addWatermark(canvas);
        }

        // ==============================
        // BLACK WHITE
        // ==============================

        function applyBlackWhite(canvas) {
            if (document.getElementById("mode").value != "bw") return;
            let ctx = canvas.getContext("2d");
            let data = ctx.getImageData(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < data.data.length; i += 4) {
                let avg = (data.data[i] + data.data[i + 1] + data.data[i + 2]) / 3;
                data.data[i] = avg;
                data.data[i + 1] = avg;
                data.data[i + 2] = avg;
            }

            ctx.putImageData(data, 0, 0);
        }

        // ==============================
        // WATERMARK
        // ==============================

        function addWatermark(canvas) {
            let ctx = canvas.getContext("2d");
            ctx.save();
            ctx.globalAlpha = document.getElementById("opacity").value;
            ctx.fillStyle = document.getElementById("wmColor").value;
            ctx.font = watermark.size + "px Arial";
            ctx.textAlign = "center";
            ctx.translate(watermark.x, watermark.y);
            ctx.rotate((watermark.rotation * Math.PI) / 180);
            ctx.fillText(document.getElementById("wmText").value, 0, 0);
            ctx.restore();
        }

        // ==============================
        // WATERMARK GESTURE
        // ==============================

        let activeCanvas = null;
        let dragging = false;
        let startX = 0;
        let startY = 0;
        let startDistance = 0;
        let startAngle = 0;

        function setupGesture(canvas) {
            canvas.addEventListener("pointerdown", (e) => {
                canvas.setPointerCapture(e.pointerId);

                if (e.pointerType == "mouse") {
                    dragging = true;
                    startX = e.offsetX;
                    startY = e.offsetY;
                }
            });

            canvas.addEventListener("pointermove", (e) => {
                if (!dragging) return;

                let dx = e.offsetX - startX;
                let dy = e.offsetY - startY;
                watermark.x += dx;
                watermark.y += dy;
                startX = e.offsetX;
                startY = e.offsetY;
                redrawAll();
            });

            canvas.addEventListener("pointerup", () => {
                dragging = false;
            });
        }

        setupGesture(frontCanvas);
        setupGesture(backCanvas);

        document.querySelectorAll("input,select").forEach((item) => {
            item.oninput = function () {
                redrawAll();
            };
        });

        function redrawAll() {
            if (frontImg) draw(frontImg, frontCanvas);
            if (backImg) draw(backImg, backCanvas);
        }

        // ==============================
        // GENERATE PDF
        // =============================
        function generatePDF() {
            if (!frontImg || !backImg) {
                alert("Please upload Front and Back IC");
                return;
            }

            const { jsPDF } = window.jspdf;

            let pdf = new jsPDF("p", "mm", "a4");

            pdf.setProperties({
                title: "Malaysia IC Copy",
            });

            const icWidth = 85.6;
            const icHeight = 54;
            const pageWidth = 210;
            const centerX = (pageWidth - icWidth) / 2;

            pdf.addImage(frontCanvas.toDataURL("image/jpeg", 0.95), "JPEG", centerX, 30, icWidth, icHeight);
            pdf.addImage(backCanvas.toDataURL("image/jpeg", 0.95), "JPEG", centerX, 150, icWidth, icHeight);

            pdf.save("Malaysia_IC.pdf");
        }
    </script>
</html>
