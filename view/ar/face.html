<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Face AR</title>

        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
                font-family: Arial, sans-serif;
            }

            #camera {
                position: fixed;

                inset: 0;

                width: 100%;
                height: 100%;

                object-fit: cover;

                transform: scaleX(-1);

                z-index: 1;
            }

            #overlay {
                position: fixed;

                inset: 0;

                width: 100%;
                height: 100%;

                z-index: 2;

                pointer-events: none;
            }

            #startScreen {
                position: fixed;

                inset: 0;

                z-index: 10;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: center;

                color: white;

                background:
                    rgba(0, 0, 0, 0.65);

                text-align: center;

                padding: 30px;
            }

            #startScreen h1 {
                font-size: 36px;
                margin-bottom: 10px;
            }

            #startScreen p {
                max-width: 350px;
                line-height: 1.6;
            }

            button {
                border: 0;

                padding: 14px 28px;

                border-radius: 30px;

                background: #ff9fba;

                color: white;

                font-size: 18px;

                font-weight: bold;
            }

            #status {
                position: fixed;

                top: 20px;

                left: 50%;

                transform: translateX(-50%);

                z-index: 5;

                padding: 10px 18px;

                border-radius: 30px;

                background:
                    rgba(0, 0, 0, 0.5);

                color: white;

                backdrop-filter: blur(8px);
            }
        </style>
    </head>


    <body>
        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>

        <canvas id="overlay"></canvas>

        <div id="status">
            📷 Waiting for face...
        </div>

        <div id="startScreen">
            <h1>
                🎀 Cute Face AR
            </h1>
            <p>
                Allow camera access and
                put your face in front of
                the camera.
            </p>

            <button onclick="startAR()">
                Start
            </button>
        </div>

        <script type="module">

            import {
                FaceLandmarker,
                FilesetResolver
            } from
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";


            const video =
                document.getElementById(
                    "camera"
                );


            const canvas =
                document.getElementById(
                    "overlay"
                );


            const ctx =
                canvas.getContext(
                    "2d"
                );


            const status =
                document.getElementById(
                    "status"
                );


            const startScreen =
                document.getElementById(
                    "startScreen"
                );


            let faceLandmarker;

            let running = false;


            /*
            =========================================
            Create Face Landmarker
            =========================================
            */

            async function createFaceLandmarker() {

                const vision =
                    await FilesetResolver.forVisionTasks(

                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"

                    );


                faceLandmarker =
                    await FaceLandmarker.createFromOptions(

                        vision,

                        {

                            baseOptions: {

                                modelAssetPath:
                                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

                            },

                            runningMode:
                                "VIDEO",

                            numFaces:
                                1,

                            minFaceDetectionConfidence:
                                0.5,

                            minFacePresenceConfidence:
                                0.5,

                            minTrackingConfidence:
                                0.5

                        }

                    );

            }


            /*
            =========================================
            Camera
            =========================================
            */

            async function startCamera() {

                const stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode:
                                    "user"

                            },

                            audio: false

                        });


                video.srcObject =
                    stream;


                await video.play();

            }


            /*
            =========================================
            Start
            =========================================
            */

            window.startAR =
                async function() {

                    startScreen.style.display =
                        "none";


                    status.textContent =
                        "Loading face tracking...";


                    await createFaceLandmarker();


                    await startCamera();


                    running = true;


                    resizeCanvas();


                    detectFace();

                };


            /*
            =========================================
            Canvas Size
            =========================================
            */

            function resizeCanvas() {

                canvas.width =
                    window.innerWidth *
                    window.devicePixelRatio;


                canvas.height =
                    window.innerHeight *
                    window.devicePixelRatio;


                canvas.style.width =
                    window.innerWidth + "px";


                canvas.style.height =
                    window.innerHeight + "px";


                ctx.setTransform(
                    window.devicePixelRatio,
                    0,
                    0,
                    window.devicePixelRatio,
                    0,
                    0
                );

            }


            window.addEventListener(
                "resize",
                resizeCanvas
            );


            /*
            =========================================
            Detect Face
            =========================================
            */

            let lastVideoTime = -1;


            function detectFace() {

                if (!running) {
                    return;
                }


                if (
                    video.readyState >= 2 &&
                    video.currentTime !== lastVideoTime
                ) {

                    lastVideoTime =
                        video.currentTime;


                    const result =
                        faceLandmarker.detectForVideo(

                            video,

                            performance.now()

                        );


                    drawAR(result);

                }


                requestAnimationFrame(
                    detectFace
                );

            }


            /*
            =========================================
            Draw AR
            =========================================
            */

            function drawAR(result) {

                ctx.clearRect(
                    0,
                    0,
                    window.innerWidth,
                    window.innerHeight
                );


                if (
                    !result.faceLandmarks ||
                    result.faceLandmarks.length === 0
                ) {

                    status.textContent =
                        "📷 Face not found";

                    return;

                }


                status.textContent =
                    "✨ Face detected!";


                const face =
                    result.faceLandmarks[0];


                /*
                -------------------------------------
                Get points
                -------------------------------------
                */

                const forehead =
                    face[10];


                const leftCheek =
                    face[234];


                const rightCheek =
                    face[454];


                /*
                -------------------------------------
                Convert coordinates
                -------------------------------------
                */

                const foreheadPoint =
                    getPoint(
                        forehead
                    );


                const leftCheekPoint =
                    getPoint(
                        leftCheek
                    );


                const rightCheekPoint =
                    getPoint(
                        rightCheek
                    );


                /*
                -------------------------------------
                Face width
                -------------------------------------
                */

                const faceWidth =
                    Math.abs(
                        rightCheekPoint.x -
                        leftCheekPoint.x
                    );


                /*
                -------------------------------------
                Draw bow
                -------------------------------------
                */

                drawBow(

                    foreheadPoint.x,

                    foreheadPoint.y -

                    faceWidth * 0.45,

                    faceWidth * 0.55

                );


                /*
                -------------------------------------
                Draw cheeks
                -------------------------------------
                */

                drawCheek(

                    leftCheekPoint.x,

                    leftCheekPoint.y,

                    faceWidth * 0.14

                );


                drawCheek(

                    rightCheekPoint.x,

                    rightCheekPoint.y,

                    faceWidth * 0.14

                );

            }


            /*
            =========================================
            Coordinate
            =========================================
            */

            function getPoint(point) {

                return {

                    x:
                        (1 - point.x) *
                        window.innerWidth,

                    y:
                        point.y *
                        window.innerHeight

                };

            }


            /*
            =========================================
            Bow
            =========================================
            */

            function drawBow(
                x,
                y,
                size
            ) {

                ctx.save();


                /*
                Left
                */

                ctx.beginPath();

                ctx.ellipse(

                    x - size * 0.32,

                    y,

                    size * 0.32,

                    size * 0.22,

                    -0.3,

                    0,

                    Math.PI * 2

                );

                ctx.fillStyle =
                    "#ff9fba";

                ctx.fill();


                /*
                Right
                */

                ctx.beginPath();

                ctx.ellipse(

                    x + size * 0.32,

                    y,

                    size * 0.32,

                    size * 0.22,

                    0.3,

                    0,

                    Math.PI * 2

                );

                ctx.fill();


                /*
                Middle
                */

                ctx.beginPath();

                ctx.arc(

                    x,

                    y,

                    size * 0.13,

                    0,

                    Math.PI * 2

                );

                ctx.fillStyle =
                    "#ff6f9d";

                ctx.fill();


                ctx.restore();

            }


            /*
            =========================================
            Cheek
            =========================================
            */

            function drawCheek(
                x,
                y,
                size
            ) {

                ctx.save();


                ctx.globalAlpha =
                    0.55;


                ctx.fillStyle =
                    "#ff9fba";


                ctx.beginPath();

                ctx.ellipse(

                    x,

                    y,

                    size,

                    size * 0.45,

                    0,

                    0,

                    Math.PI * 2

                );


                ctx.fill();


                ctx.restore();

            }

        </script>
    </body>
</html>
